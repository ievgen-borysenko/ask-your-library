# Demo corpus manifest — the single source of truth for what the demo library contains.
# scripts/ingest_demo_corpus.py builds the corpus from this file; the CI guard
# (tests/test_golden_books_in_manifest.py) rejects golden questions that reference
# books outside this list.
#
# source: gutenberg  -> plain-text download by pg_id, header/footer stripped
# source: librivox   -> per-chapter mp3s from archive.org item, transcribed locally
# source: canary     -> synthetic book committed under corpus/canaries/
#
# Naming convention: `id` is the primary key (file names, chunk ids). When a
# second edition/translation of the same work is added, BOTH its id and title
# get a qualifier (e.g. id: kobzar-hunter-tr, title: "The Kobzar ... (Hunter
# translation)") — the DB's book field is "Title — Author" and must stay
# unique. CI enforces uniqueness of ids and (title, author) pairs.

