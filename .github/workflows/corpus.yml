name: corpus

on:
  # No push trigger: what a merge to main would verify, the pull request that
  # produced it has just verified, and a download of 31 books is not free.
  pull_request:
    paths:
      - "corpus/**"
      - "scripts/ingest_demo_corpus.py"
      # The second shelf (#58), verified by the same job: its pins answer to
      # four publishers rather than to Project Gutenberg, and the works are not
      # committed either, so a changed page upstream is invisible here until
      # something re-fetches and re-hashes them.
      - "corpus-tech/**"
      - "scripts/fetch_tech_shelf.py"
      # The toc files this job diffs are written by split_chapters, which lives
      # in the package, not in the script — a change there moves chapter
      # boundaries with nothing under corpus/ or scripts/ touched. Only this
      # module: the rest of src/ decides what happens after the split, and the
      # download of 31 books is not worth spending on every source edit.
      - "src/ask_your_library/ingest/chapters.py"
      - ".github/workflows/corpus.yml"
  schedule:
    # The pins answer to Project Gutenberg, not to this repository: PG
    # regenerates a book's plain text whenever its source is corrected, and the
    # first person to notice is otherwise a visitor running the documented
    # `uv run scripts/ingest_demo_corpus.py` and watching it exit 1 on a
    # checksum mismatch. Weekly, at an hour of its own so it does not queue
    # behind the security scan (17 5 * * 1). Scheduled runs come from the
    # default branch only, so this schedule starts working once it is on main.
    - cron: "41 7 * * 1"

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-latest
    # 31 downloads and a chapter split for the classics, plus about 170 polite
    # (one-at-a-time, paced) requests for the engineer's shelf. A run that has
    # not finished in thirty minutes is a hung request, not a slow one, and
    # holds a runner until the six-hour default gives up on it.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job fetches from the open internet and pushes nothing back, so
          # the checkout token has no work here and is not left in the config.
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # The uv the lockfile is maintained with, as in ci.yml.
          version: "0.12.10"
      - name: Install (locked)
        # The lockfile's default environment. No `--extra ui`: nothing here
        # starts the web chat, and no embedding model is loaded at any point.
        run: uv sync --locked
      - name: Download the sources and verify every pinned checksum
        # prepare-text downloads the 31 Gutenberg texts and checks each against
        # its manifest sha256; prepare-audio checks the two committed LibriVox
        # transcripts against theirs. Between them that is every checksum the
        # manifest holds. Neither stage embeds, so no Ollama and no model is
        # involved, and a mismatch exits 1 — which is the whole point of the job.
        run: |
          uv run scripts/ingest_demo_corpus.py --stage prepare-text
          uv run scripts/ingest_demo_corpus.py --stage prepare-audio
      - name: Re-split the canaries too (no network)
        # corpus/canaries/** is in the path filter above, and their text is
        # committed — so an edit to a canary changes its toc with nothing
        # downloaded. Without this stage the two canary toc files were the only
        # ones the diff below could never have anything to say about.
        run: uv run scripts/ingest_demo_corpus.py --stage prepare-canaries
      - name: The chapter split still matches the committed tables of contents
        # The stages above rewrite corpus/toc/*.json from the sources they just
        # read. A re-pin makes the checksums green by construction; this is what
        # says the new upstream file is still the same book — same chapters, same
        # titles. Red here means a re-pin changed the corpus, not just its bytes.
        #
        # Staged, not `git diff` alone: a book added to the manifest without its
        # toc file, or an id renamed, writes a NEW file, and an untracked file is
        # invisible to a plain diff — the one shape of drift that would have
        # passed here silently. `git add -A` stages the additions and the
        # deletions too, and the cached diff then prints what changed.
        run: |
          git add -A -- corpus/toc
          git diff --cached --exit-code -- corpus/toc
      - name: Re-fetch the engineer's shelf and verify every pinned file
        # Last in the job, so a red shelf never skips the classics' toc diff
        # above. One step, not a job of its own: the required checks are named after
        # jobs, and a new job would have to be added to the branch protection
        # before it could ever block anything. The two stages are the whole
        # check — fetch (cached per run, so this downloads each file once) and
        # verify, which re-hashes every file against corpus-tech/manifest.yaml
        # and exits 1 on the first page a publisher has edited.
        #
        # `prepare` is not run in THIS step: a changed page fails the pins
        # before any text is built from it. The next step runs it, without the
        # PDF works (pdftotext is not part of this image's contract), to
        # re-check the committed chapter lists and structure cards.
        run: |
          uv run scripts/fetch_tech_shelf.py --stage fetch
          uv run scripts/fetch_tech_shelf.py --stage verify
      - name: The shelf's chapter lists and structure cards are what the code builds
        # The toc and the structure cards are committed, and both are written by
        # code from what was just fetched — so a change to the reader or the
        # chapter splitter that moves a chapter title shows up here, on the
        # change itself, rather than as a silent drift between the committed
        # files and what any fresh build produces. `git status` rather than
        # `git diff` so that a file the build writes and the tree lacks fails
        # too. --skip-pdf leaves out OWASP, the one work read through pdftotext:
        # poppler is not part of this image, and a distro poppler that lays the
        # text out differently from the one the toc was built with would make
        # this step red over a tool version rather than over the code. OWASP's
        # chapter list is therefore the one this step does not re-check.
        run: |
          uv run scripts/fetch_tech_shelf.py --stage prepare --skip-pdf
          uv run scripts/fetch_tech_shelf.py --stage toc --skip-pdf
          uv run scripts/fetch_tech_shelf.py --stage structure-cards
          git status --porcelain -- corpus-tech/toc corpus-tech/cards
          git diff --exit-code -- corpus-tech/toc corpus-tech/cards
          test -z "$(git status --porcelain -- corpus-tech/toc corpus-tech/cards)"
