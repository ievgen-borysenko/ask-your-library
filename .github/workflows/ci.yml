name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # config resolves LLM_BACKEND once, at import time, so tests that describe
      # one backend must pin it. Running the suite under both is what keeps those
      # pins honest: no Ollama is started here, and no test needs one.
      # Both legs EXPORT the name, neither leans on config.py's default. That is
      # not decoration since the default flipped to ollama: the openrouter leg
      # would otherwise run the local configuration under a job called
      # "test (openrouter)" and prove nothing about the hosted path.
      # The job names are required checks in the branch ruleset — "test
      # (openrouter)", "test (ollama)" — so this list is order- and
      # spelling-sensitive; renaming or reordering it blocks every merge.
      matrix:
        backend: [openrouter, ollama]
    env:
      LLM_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # The uv the lockfile is maintained with. The action SHA pins the
          # action; without this it still installs whatever uv is newest, so
          # the resolver CI runs is not the one the developer runs.
          version: "0.12.10"
      - name: Install (locked)
        run: uv sync --locked --group dev
      - name: Unit tests + golden-set guard
        # -rs prints the skip reasons: this job runs on Linux, where the whole
        # macOS installer file skips itself, and a silent skip reads as a pass.
        run: uv run pytest -q -rs

  test-ui:
    # The UI tests skip themselves without the chainlit extra; this job is the
    # one place they actually run, so a green "test" alone never means "UI ok".
    # Same two backends as `test`: the UI tests pin the backend too.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [openrouter, ollama]
    env:
      LLM_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
      - name: Install (locked, with the ui extra)
        run: uv sync --locked --group dev --extra ui
      - name: The ui extra is really installed
        # Every ui-gated test skips itself when chainlit is missing, and a run
        # of nothing but skips is green. This job exists to run them, so a
        # missing extra has to fail here rather than pass quietly below.
        run: uv run python -c "import chainlit"
      - name: UI rendering contracts
        # The canary's own tests are here too: their ui-gated half is skipped
        # everywhere else, so this is the only place it runs. -rs prints what
        # was skipped, so an all-skipped green run is visible in the log.
        run: uv run pytest -q tests/test_ui.py tests/test_injection_canary.py -rs
      - name: Injection canary, mechanics only (no LLM call, no API key)
        # The canary's UI stage imports ui.py, which refuses to start a server
        # without a key; here it is a module under test, not a server.
        env:
          AYL_ALLOW_START_WITHOUT_KEY: "1"
        run: uv run eval/injection_canary.py --no-live

  install-script:
    # scripts/install-mac.sh refuses to run anywhere but macOS, so most of its
    # tests skip themselves on the two Linux jobs above: this is the one place
    # the dry run is actually exercised. That file only, and no backend matrix —
    # the script reads config.py, it does not import the package.
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
      - name: Install (locked)
        run: uv sync --locked --group dev
      - name: The macOS installer, dry run against recorders
        run: uv run pytest -q tests/test_install_script.py -rs

  workflows:
    # Lints every workflow file's syntax, expressions, and the shell embedded
    # in their `run:` steps. Nothing here needs more than the files this
    # checkout already has, and nothing is pushed back.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (release tarball, SHA-256 verified)
        # A pinned binary over the third-party raven-actions/actionlint
        # wrapper: that action is not published by actionlint's own author,
        # and pinning it to a SHA would still trust whatever the action's own
        # code fetches at run time unless that is re-read on every bump. A
        # tarball straight from rhysd/actionlint's release, checked against
        # its published checksum, is one hop instead of two.
        run: |
          set -euo pipefail
          version=1.7.12
          sha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -sSfL -o actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          echo "${sha256}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint -version
      - name: Lint the workflows
        # shellcheck ships on ubuntu-latest and actionlint finds it on PATH
        # with no extra install, so every `run:` step's shell is checked too.
        # pyflakes is not installed here, so actionlint's python-only checks
        # disable themselves rather than half-running.
        run: actionlint -color .github/workflows/*.yml
