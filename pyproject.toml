[project]
name = "ask-your-library"
version = "0.3.1"
description = "Agentic RAG over your own book library: LangGraph orchestrator, hybrid retrieval, quote-provenance validation, evals"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Ievgen Borysenko" }]
dependencies = [
    "langgraph>=0.4",
    "langchain-openai>=0.3",
    # llm.py imports both at module import time, so neither is a transitive
    # detail any more: the retry loop is ours and speaks the SDK's exception
    # vocabulary (`openai.APIConnectionError`, `APIStatusError`), and it builds
    # each attempt's client with an `httpx.Timeout` of its own. Bounds are the
    # versions the lockfile resolves and CI tests against.
    "openai>=3.1",
    "httpx>=0.28",
    # `lancedb.expr` (the chapter filters in library.py) is imported at module
    # import time; 0.34 is the oldest version verified to have col/lit/contains
    # and expression pushdown (older ones are untested, not known to lack it);
    # the lockfile resolves 0.38.0.
    "lancedb>=0.34",
    # Imported directly by the ingest package (kept_rows, the staged publish
    # batches), not only pulled in by lancedb; the bound is the version the
    # lockfile resolves and CI tests against.
    "pyarrow>=25.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/ievgen-borysenko/ask-your-library"
Issues = "https://github.com/ievgen-borysenko/ask-your-library/issues"

[project.optional-dependencies]
# Chainlit web chat (ui.py) and its SQLite persistence layer.
ui = ["chainlit>=2.12", "sqlalchemy>=2.0", "aiosqlite>=0.20", "greenlet>=3.0"]

[project.scripts]
ayl = "ask_your_library.ayl:main"
# The two names `ayl` replaced (#30). They run the same code through a wrapper
# that prints one deprecation line to stderr, so every command line already
# written down — in these docs, in scripts/install-mac.sh, in someone's shell
# history — keeps working; they are removed at 0.6.0.
ask-library = "ask_your_library.cli:ask_library_main"
ayl-add = "ask_your_library.ingest.add_folder:ayl_add_main"

[dependency-groups]
# playwright drives the real Chainlit server in a real browser (tests/ui). The
# browser binary itself is NOT a Python package: `uv run playwright install
# chromium` fetches it, and tests/ui/test_ui_smoke.py skips itself with that
# command in the reason when it is absent, so `uv run pytest -q` stays green and
# fast on a clone that never ran it.
#
# The library, not the pytest-playwright plugin: its `browser` fixture is
# session-scoped, and Playwright's sync driver keeps a RUNNING asyncio loop in
# the main thread for as long as it is open, which makes every later
# `asyncio.run(...)` in the suite (tests/test_ui.py is full of them) raise. The
# test owns the browser for one test instead, and needs no plugin to do it.
dev = ["pytest>=8.0", "playwright>=1.49"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ask_your_library"]

[tool.pytest.ini_options]
testpaths = ["tests"]
