# The engineer's shelf — the single source of truth for the second demo corpus.
# scripts/fetch_tech_shelf.py builds it from this file; nothing of the text is
# committed, so this manifest and corpus-tech/toc/ are the whole record of what
# the shelf is.
#
# Per work:
#   licence / licence_url / licence_statement / licence_checked
#     the SPDX-like identifier, the licence text it names, the page or file
#     where this work states it, and the day that page was read. A claim that
#     could not be confirmed on the source itself carries `licence_unverified`
#     instead of a guess.
#   fetch     the shape of the source, one of: html-chapters, git-markdown,
#             git-html, pdf, arxiv-html, arxiv-pdf (see the script's docstring).
#   cards     which book card the REPOSITORY carries for this work — one of
#             three values, with no fourth:
#               shared     a full card, written by a model at `--stage cards`
#                          and committed to corpus-tech/cards/. For the works
#                          whose licence allows a derivative to be shared.
#               structure  a facts-only card, built by code with no model at
#                          `--stage structure-cards` and committed to
#                          corpus-tech/cards/: the title, the chapter list and
#                          the publisher's own description (`about`), all
#                          reproduced verbatim and attributed. A reproduction
#                          in part, which is what CC BY-NC-ND grants, and never
#                          a summary, which is the derivative it withholds. The
#                          three CC BY-NC-ND works are `structure`.
#               local      no committed card; a full card, written by a model
#                          at `--stage cards` into $AYL_HOME/cards/tech/,
#                          outside any checkout: a card the reader may build
#                          for themself but the repository may not share. A
#                          work that names no value is treated as `local`.
#   local_card
#             `structure` works only, default false: true means the reader's
#             machine ALSO builds a full model-written card at `--stage cards`,
#             into $AYL_HOME/cards/tech/ and never into the repository. The
#             three CC BY-NC-ND works carry it: the licence lets a reader make
#             an adaptation for themself (2(a)(1)(B)) and withholds sharing it.
#             A second field rather than a fourth `cards:` value, because it is
#             a second question: `cards:` says what is shipped, this says what
#             is built on the reader's machine besides it.
#             Whatever `cards:` says, a model-written card of a work whose
#             licence is NoDerivatives is only ever written under AYL_HOME
#             (`card_targets` and `card_dir` in the script).
#   about / about_source / about_checked
#             `structure` works only: the publisher's own one-paragraph
#             description of the work, copied character for character (only
#             the line breaks of the page are folded), the page it was copied
#             from, and the day that page was read.
#   pin       what the sha256 under `sources` is taken of: `bytes` for the file
#             as fetched, `text` for the text the HTML reader extracts from it.
#             Two of these publishers do not serve the same bytes twice —
#             developers.google.com stamps every response with a CSP nonce and
#             an analytics blob whose keys come out in a random order, and
#             abseil.io is behind Cloudflare's email obfuscation, which rewrites
#             the book's "Email ... to comment" link per response — so a
#             byte pin on those was red on every run and could never report a
#             real edit. None of that noise is text of the book. There is no
#             default: a work added without a rule here is a failure.
#   sources   sha256 of every file fetched to build the work, taken per the
#             work's `pin`, written by `--stage checksums` and re-checked by
#             `--stage verify`. Per file, not per work: these books are dozens
#             of separately published pages, and a red weekly job has to say
#             WHICH chapter changed. `_pages.json` is the page order the fetch
#             stage worked out from the publisher's own table of contents,
#             pinned with the pages so that a renamed or re-ordered chapter is a
#             failure and not a silent change of edition — and hashed as bytes
#             whatever the work's `pin` says, because it is not a page to read.
#   note      why the work is on the shelf.
#
# `id` is the primary key: file names under prepared/ and toc/, and the key the
# golden set's expected_books resolve against (tests/test_tech_shelf.py).

works:
  - id: sre-book
    title: "Site Reliability Engineering"
    author: "Betsy Beyer, Chris Jones, Jennifer Petoff, Niall Richard Murphy (eds.)"
    year: 2016
    kind: book
    licence: "CC-BY-NC-ND-4.0"
    licence_url: "https://creativecommons.org/licenses/by-nc-nd/4.0/"
    licence_statement: "https://sre.google/sre-book/table-of-contents/"
    licence_checked: 2026-09-17
    source: "https://sre.google/sre-book/table-of-contents/"
    fetch: html-chapters
    pin: text
    # Every chapter of the book is a page of its own under /sre-book/; the table
    # of contents lists each twice (side navigation and body) and the fetch
    # keeps the first, so the page order is the book's order.
    page_pattern: "^/sre-book/(?!table-of-contents/)[^/]+/$"
    container: "div#content"
    cards: structure
    local_card: true
    about: >-
      Members of the SRE team explain how their engagement with the entire
