    fetch: git-html
    repo: google/building-secure-and-reliable-systems
    ref: main
    # The repository ships the book as the publisher's own HTML, not as
    # Markdown, and raw/atlas.json is the build manifest that lists the files in
    # reading order — the publisher's order, which stays right when a file moves.
    order_file: raw/atlas.json
    # Everything that is not the book: covers, the copyright page, the table of
    # contents, and the index of page numbers. cover.html and colo.html are
    # listed in atlas.json but are not in the repository at all.
