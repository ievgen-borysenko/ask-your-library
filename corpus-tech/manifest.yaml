    pin: text
    page_pattern: "^/workbook/(?!table-of-contents/)[^/]+/$"
    container: "div#content"
    cards: structure
    local_card: true
    about: >-
      The Site Reliability Workbook is the hands-on companion to the bestselling
      Site Reliability Engineering book and uses concrete examples to show how
      to put SRE principles and practices to work. This book contains practical
      examples from Google’s experiences and case studies from Google’s Cloud
      Platform customers. Evernote, The Home Depot, The New York Times, and
      other companies outline hard-won experiences of what worked for them and
      what didn’t.
    about_source: "https://sre.google/books/"
    about_checked: 2026-09-19
    note: >-
      The other half of the toil pair, and the shelf's worked examples: the
      error budget policy and the SLO documents are here rather than in the SRE
      book.
